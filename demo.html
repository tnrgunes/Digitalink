<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Probeer het zelf — live demo | Digital Ink</title>
<meta name="description" content="Probeer gratis een boekingssysteem met eigen beheerpaneel en meldingen, met de naam van uw eigen zaak. Live demo van Digital Ink.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://digital-ink.be/demo.html">
<meta property="og:title" content="Probeer het zelf — boekingssysteem demo | Digital Ink">
<meta property="og:description" content="Typ de naam van uw zaak en probeer het boekingssysteem en beheerpaneel live.">
<meta property="og:image" content="https://i.postimg.cc/5NxHH5w4/IMG-3010.jpg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0908;--line:rgba(212,175,55,.16);--line2:rgba(212,175,55,.38);--gold:#d4af37;--gold2:#f2e3b0;--goldgrad:linear-gradient(135deg,#e6c65a,#c9992c);
--text:#F4EFE6;--muted:rgba(244,239,230,.66);--faint:rgba(244,239,230,.4);--serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
--acc:#d4af37;--acc2:#f2e3b0;--accbg:rgba(212,175,55,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 80% at 10% -10%,rgba(212,175,55,.16),transparent 60%),radial-gradient(90% 70% at 95% 5%,rgba(184,110,44,.12),transparent 55%),var(--ink);min-height:100vh;overflow-x:hidden}
button,input,select{font-family:inherit}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line2);object-fit:cover}
.brand span{font-family:var(--serif);font-size:1.2rem}
.top-r{display:flex;gap:8px;align-items:center}
.lang-sw{display:flex;border:1px solid rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.lang-sw button{background:none;border:none;color:var(--faint);font:700 10.5px var(--sans);padding:8px 10px;cursor:pointer}
.lang-sw button.on{background:rgba(212,175,55,.16);color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:14px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s;white-space:nowrap}
.btn-gold{background:var(--goldgrad);color:#170f02;box-shadow:0 12px 34px rgba(212,175,55,.25)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border-color:var(--line2)}
.hide-s{display:none}@media(min-width:720px){.hide-s{display:inline-flex}}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 120px}
.intro{text-align:center;max-width:760px;margin:18px auto 26px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--gold2)}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin:12px 0 12px}
.intro h1 em{font-style:italic;background:linear-gradient(120deg,#b8860b,#f4e7bb 45%,#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.intro p{color:var(--muted);font-size:1.02rem;line-height:1.65}

/* setup */
.setup{display:grid;grid-template-columns:1fr;gap:14px;align-items:end;max-width:980px;margin:0 auto 18px;padding:18px;border-radius:22px;background:rgba(28,21,13,.66);border:1px solid var(--line);backdrop-filter:blur(16px)}
@media(min-width:820px){.setup{grid-template-columns:1.3fr 1fr auto}}
.setup label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--faint);margin-bottom:7px}
.inp{width:100%;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:var(--text);font-size:16px;outline:none}
.inp:focus{border-color:var(--gold)}
select.inp option{background:#15100a}
.sw{display:flex;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw button.on{border-color:#fff}

/* steps */
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 22px;max-width:980px}
.st{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--muted);transition:.3s}
.st i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted)}
.st.cur{border-color:var(--gold);color:var(--gold2);background:rgba(212,175,55,.08)}
.st.cur i{background:var(--goldgrad);color:#170f02}
.st.done{color:#bbf7d0;border-color:rgba(74,222,128,.4)}
.st.done i{background:#22c55e;color:#06210f}

/* stage */
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.tabs button{flex:1;max-width:220px;padding:12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;position:relative}
.tabs button.on{background:rgba(212,175,55,.14);border-color:var(--gold);color:var(--gold2)}
.tabs .dot{position:absolute;top:6px;right:14px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;line-height:18px;padding:0 5px;display:none}
@media(min-width:900px){.tabs{display:none}}
.stage{display:grid;grid-template-columns:1fr;gap:30px;justify-items:center}
@media(min-width:900px){.stage{grid-template-columns:1fr 1fr}}
.pane{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.pane-h{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--faint);display:flex;align-items:center;gap:8px}
.pane-h b{color:var(--gold2)}
@media(max-width:899px){.pane{display:none}.pane.show{display:flex}}
.phone{position:relative;width:min(100%,360px);height:720px;border-radius:50px;padding:12px;background:linear-gradient(145deg,#2a2218,#0e0b07);border:1px solid rgba(212,175,55,.3);box-shadow:0 50px 100px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.04)}
.phone::before{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:14px;background:#050403;z-index:20}
.screen{position:relative;width:100%;height:100%;border-radius:39px;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:50px}
.scroll::-webkit-scrollbar{display:none}

/* CUSTOMER SITE */
.site{background:#0f0d0c;color:#f6f2ea;font-size:13px}
.s-hero{padding:22px 20px 26px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,var(--accbg),transparent 70%)}
.s-logo{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px;color:#120c05;background:var(--acc);box-shadow:0 0 30px var(--accbg)}
.s-name{font-family:var(--serif);font-size:27px;line-height:1.05;letter-spacing:.01em}
.s-tag{color:rgba(246,242,234,.65);font-size:12.5px;margin-top:6px}
.s-ann{margin:12px auto 0;display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--acc);color:var(--acc2);font-size:11px;font-weight:600}
.s-sec{padding:16px 18px}
.s-lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--acc2);margin-bottom:10px}
.svc{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:7px;cursor:pointer;transition:.2s}
.svc b{font-weight:600}
.svc span{color:var(--acc2);font-weight:700}
.svc.on{border-color:var(--acc);background:var(--accbg)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:9px;color:rgba(246,242,234,.4);font-weight:700;padding:2px 0}
.cal button{padding:8px 0;border-radius:9px;border:none;background:rgba(255,255,255,.05);color:#f6f2ea;font-size:12px;cursor:pointer}
.cal button:disabled{opacity:.22;cursor:default;text-decoration:line-through}
.cal button.full{opacity:.35;text-decoration:line-through;cursor:default}
.cal button.on{background:var(--acc);color:#120c05;font-weight:800}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.times button{padding:10px 0;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#f6f2ea;font-weight:700;font-size:12px;cursor:pointer}
.times button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2)}
.times button:disabled{opacity:.25;text-decoration:line-through}
.f{width:100%;padding:12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#f6f2ea;font-size:15px;margin-bottom:7px;outline:none}
.f:focus{border-color:var(--acc)}
.s-btn{width:100%;padding:14px;border-radius:999px;border:none;background:var(--acc);color:#120c05;font-weight:800;font-size:12px;letter-spacing:.12em;cursor:pointer;margin-top:4px}
.s-btn:disabled{opacity:.4}
.s-err{color:#fca5a5;font-size:11.5px;min-height:16px;margin-top:6px;text-align:center}
.s-done{text-align:center;padding:30px 20px}
.s-done .ok{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--accbg);border:1px solid var(--acc);color:var(--acc2);font-size:26px}
.s-done h3{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:6px}
.s-done p{color:rgba(246,242,234,.65)}
.s-foot{padding:18px;text-align:center;font-size:10px;color:rgba(246,242,234,.35)}

/* OWNER PANEL */
.panel{background:#0d0a12;color:#f5f1fb;font-size:13px}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.p-head b{font-family:var(--serif);font-weight:400;font-size:22px}
.p-head small{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);font-weight:700}
.p-av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#120c05;display:flex;align-items:center;justify-content:center;font-weight:800}
.p-body{padding:4px 14px 90px}
.p-kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.p-kpi{border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.p-kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.p-kpi small{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,222,250,.5);font-weight:700}
.p-lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--acc2);margin:14px 2px 8px}
.req{border-radius:14px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;animation:pop .45s cubic-bezier(.2,.7,.3,1)}
.req.new{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.req b{display:block;font-size:13.5px}
.req small{color:rgba(232,222,250,.6);font-size:11px}
.req .tag{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:999px;background:var(--accbg);color:var(--acc2);font-size:9.5px;font-weight:800;letter-spacing:.06em}
.req .acts{display:flex;gap:6px;margin-top:10px}
.req .acts button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:10.5px;letter-spacing:.08em;cursor:pointer}
.ok-b{background:#16a34a;color:#fff}.no-b{background:rgba(255,255,255,.08);color:rgba(232,222,250,.75)}
.req.appr{border-color:rgba(74,222,128,.35)}
.req .state{margin-top:8px;font-size:10.5px;font-weight:800;letter-spacing:.06em}
.empty{text-align:center;color:rgba(232,222,250,.45);padding:22px 10px;font-size:12px}
.p-edit label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,222,250,.5);font-weight:700;margin:10px 2px 6px}
.p-edit .f{background:rgba(255,255,255,.06)}
.price-row{display:grid;grid-template-columns:1fr 84px;gap:6px}
.save{width:100%;padding:13px;border-radius:12px;border:none;background:var(--acc);color:#120c05;font-weight:800;font-size:11.5px;letter-spacing:.1em;cursor:pointer;margin-top:10px}
.saved{color:#86efac;font-size:11.5px;text-align:center;min-height:16px;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04)}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--acc),rgba(255,255,255,.15));transition:height .5s}
.srcrow{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 0 4px}
.srcbar{height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.srcbar i{display:block;height:100%;background:var(--acc)}
.p-nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 6px 18px;background:rgba(13,10,18,.94);border-top:1px solid rgba(255,255,255,.07);z-index:5}
.p-nav button{background:none;border:none;color:rgba(232,222,250,.45);font-size:9.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.p-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.p-nav button.on{color:var(--acc)}
.p-nav em{position:absolute;top:-4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-style:normal;font-size:9px;line-height:16px;padding:0 4px;display:none}
/* push notification */
.notif{position:absolute;left:10px;right:10px;top:46px;z-index:15;display:flex;gap:10px;padding:12px;border-radius:18px;background:rgba(48,40,62,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.5);transform:translateY(-140%);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.3,1.2),opacity .3s;cursor:pointer}
.notif.show{transform:none;opacity:1}
.notif .ap{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#120c05;font-family:var(--serif);font-size:18px}
.notif b{font-size:12px}.notif small{float:right;font-size:10px;color:rgba(255,255,255,.55)}
.notif p{font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;line-height:1.35}
.ptoast{position:fixed;left:12px;right:12px;top:12px;z-index:100;display:flex;gap:10px;padding:13px;border-radius:18px;background:rgba(48,40,62,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.6);transform:translateY(-160%);transition:transform .5s cubic-bezier(.2,.8,.3,1.2);cursor:pointer;max-width:420px;margin:0 auto}
.ptoast.show{transform:none}
.ptoast .ap{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#120c05;font-family:var(--serif);font-size:18px}
.ptoast b{font-size:12.5px}.ptoast p{font-size:12.5px;color:rgba(255,255,255,.88);margin-top:2px}.ptoast u{display:block;margin-top:6px;font-size:11px;font-weight:800;color:var(--acc2);text-decoration:none;letter-spacing:.06em}
@media(min-width:900px){.ptoast{display:none}}
.phone.buzz{animation:buzz .5s}
@keyframes buzz{20%,60%{transform:translateX(-3px) rotate(-.6deg)}40%,80%{transform:translateX(3px) rotate(.6deg)}}
/* face id lock */
.lock{position:absolute;inset:0;z-index:12;background:radial-gradient(120% 80% at 50% 0%,#2c2340,#0d0a12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f5f1fb;transition:opacity .4s}
.lock.gone{opacity:0;pointer-events:none}
.lock .fid{width:74px;height:74px;border-radius:20px;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.lock .fid svg{width:40px;height:40px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round}
.lock.scan .fid::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scan 1s ease-in-out}
@keyframes scan{from{top:0}to{top:100%}}
.lock p{font-size:12px;color:rgba(232,222,250,.7)}
.lock button{padding:11px 20px;border-radius:999px;border:1px solid var(--acc);background:none;color:var(--acc2);font-weight:800;font-size:11px;letter-spacing:.1em;cursor:pointer}
/* final cta */
.final{display:none;margin:30px auto 0;max-width:760px;text-align:center;padding:30px 22px;border-radius:24px;background:linear-gradient(140deg,rgba(212,175,55,.16),rgba(28,21,13,.75) 60%);border:1px solid var(--gold)}
.final.show{display:block;animation:pop .6s}
.final h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.1;margin-bottom:10px}
.final p{color:var(--muted);margin-bottom:18px}
.fine{text-align:center;color:var(--faint);font-size:11px;margin-top:22px}
.mbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(14,10,7,.92);border:1px solid var(--line);backdrop-filter:blur(16px)}
.mbar .btn{flex:1;padding:13px 8px;font-size:10.5px}
@media(min-width:900px){.mbar{display:none}}
/* ===== MODE SWITCH + WEBSITE DEMO ===== */
.modes{display:flex;justify-content:center;gap:6px;margin:0 auto 18px;padding:6px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);width:max-content;max-width:100%}
.modes button{padding:12px 20px;border-radius:999px;border:none;background:none;color:var(--muted);font-weight:800;font-size:12.5px;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:8px}
.modes button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;background:rgba(255,255,255,.08)}
.modes button.on{background:var(--goldgrad);color:#170f02}
.modes button.on i{background:rgba(0,0,0,.15)}
.ws-bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 18px;margin:0 auto 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips button{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chips button.on{border-color:var(--gold);background:rgba(212,175,55,.12);color:var(--gold2)}
.chips button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.ws-lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.browser{width:100%;max-width:1080px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid rgba(212,175,55,.28);box-shadow:0 50px 110px rgba(0,0,0,.7);background:#1b1611}

function $(s){return document.querySelector(s)}function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bizName(){return S.name.trim()||SECTORS[S.sector].n}
function svcName(n){return (SVC_TR[lang]&&SVC_TR[lang][n])||n}
function svcs(){var b=SECTORS[S.sector].svc;return b.map(function(x,i){return [svcName(x[0]),S.prices?S.prices[i]:x[1]]})}
function fmtDay(d){return T.days[(d.getDay()+6)%7]+' '+d.getDate()+' '+(lang==='fr'?T.months[d.getMonth()]:T.months[d.getMonth()].slice(0,3))}
function applyColor(){var c=COLORS[S.color];var r=document.documentElement.style;r.setProperty('--acc',c[0]);r.setProperty('--acc2',c[1]);
  var h=c[0].replace('#','');var rgb=[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];r.setProperty('--accbg','rgba('+rgb.join(',')+',.16)')}

function renderStatic(){
  T=L[lang];document.documentElement.lang=lang;
  $$('[data-i]').forEach(function(e){var v=T[e.getAttribute('data-i')];if(typeof v==='string')e.innerHTML=v});
  $$('.lang-sw button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===lang)});
  $('#bizName').placeholder=SECTORS[S.sector].n;
  $('#bizSector').innerHTML=Object.keys(SECTORS).map(function(k){return '<option value="'+k+'"'+(k===S.sector?' selected':'')+'>'+T.sectors[k]+'</option>'}).join('');
  $('#swatches').innerHTML=COLORS.map(function(c,i){return '<button style="background:'+c[0]+'" data-c="'+i+'" class="'+(i===S.color?'on':'')+'" aria-label="color '+(i+1)+'"></button>'}).join('');
  renderSteps();renderSite();renderPanel();renderFinal();renderWS();
}
function renderSteps(){var cur=S.steps.indexOf(0);
  $('#steps').innerHTML=T.steps.map(function(s,i){return '<div class="st '+(S.steps[i]?'done':(i===cur?'cur':''))+'"><i>'+(S.steps[i]?'✓':(i+1))+'</i>'+s+'</div>'}).join('')}
function doneStep(i){if(S.steps[i])return;S.steps[i]=1;renderSteps();if(S.steps.every(Boolean))setTimeout(function(){$('#final').classList.add('show');$('#final').scrollIntoView({behavior:'smooth',block:'center'})},900)}

/* ---------- customer site ---------- */
function days14(){var out=[],d=new Date();d.setHours(0,0,0,0);for(var i=1;out.length<14;i++){var x=new Date(d);x.setDate(d.getDate()+i);out.push(x)}return out}
function renderSite(){
  var sec=SECTORS[S.sector],box=$('#siteScroll'),top=box.scrollTop;
  if(S.done){box.innerHTML='<div class="s-hero"><div class="s-logo">'+esc(bizName().charAt(0).toUpperCase())+'</div><div class="s-name">'+esc(bizName())+'</div></div><div class="s-done"><div class="ok">✓</div><h3>'+T.doneT+'</h3><p>'+T.doneP+'</p><button class="s-btn" style="margin-top:18px" id="again">'+T.again+'</button></div><div class="s-foot">'+T.foot+'</div>';return}
  var list=svcs(),ds=days14();
  var cal='<div class="cal">'+T.days.map(function(d){return '<b>'+d+'</b>'}).join('');
  var lead=(ds[0].getDay()+6)%7;for(var k=0;k<lead;k++)cal+='<span></span>';
  ds.forEach(function(d){var key=d.toISOString().slice(0,10),closed=d.getDay()===0||d.getDay()===1,full=(S.booked[key]||0)>=3;
    cal+='<button data-day="'+key+'"'+(closed?' disabled':'')+' class="'+(full?'full':'')+(S.day===key?' on':'')+'">'+d.getDate()+'</button>'});
  cal+='</div>';
  var times=['10:00','11:30','13:00','14:30','16:00','17:30'];
  var taken=S.agenda.concat(S.reqs).filter(function(r){return r.day===S.day&&r.state!=='no'}).map(function(r){return r.time});
  box.innerHTML='<div class="s-hero"><div class="s-logo">'+esc(bizName().charAt(0).toUpperCase())+'</div><div class="s-name">'+esc(bizName())+'</div><div class="s-tag">'+esc(S.tag!=null?S.tag:T.tagline[S.sector])+'</div>'+((S.ann!=null?S.ann:T.ann)?'<div class="s-ann">'+esc(S.ann!=null?S.ann:T.ann)+'</div>':'')+'</div>'
   +'<div class="s-sec"><div class="s-lbl">'+T.sChoose+'</div>'+list.map(function(s,i){return '<div class="svc'+(S.svc===i?' on':'')+'" data-svc="'+i+'"><b>'+esc(s[0])+'</b><span>€'+s[1]+'</span></div>'}).join('')+'</div>'
   +'<div class="s-sec"><div class="s-lbl">'+T.sDay+'</div><div class="cal-h"><span>'+T.months[ds[0].getMonth()]+' '+ds[0].getFullYear()+'</span></div>'+cal
   +(S.day?'<div class="s-lbl" style="margin-top:14px">'+T.sTime+'</div><div class="times">'+times.map(function(t){return '<button data-time="'+t+'"'+(taken.indexOf(t)>=0?' disabled':'')+' class="'+(S.time===t?'on':'')+'">'+t+'</button>'}).join('')+'</div>':'')+'</div>'
   +'<div class="s-sec"><div class="s-lbl">'+T.sYou+'</div><input class="f" id="cName" placeholder="'+T.fName+'" maxlength="40" autocomplete="off"><input class="f" id="cPhone" placeholder="'+T.fPhone+'" inputmode="tel" autocomplete="off"><button class="s-btn" id="cSend">'+T.send+'</button><div class="s-err" id="cErr"></div></div>'
   +'<div class="s-foot">'+T.foot+'</div>';
  box.scrollTop=top;
}
function sendBooking(){
  var name=($('#cName').value||'').trim(),err=$('#cErr');
  if(S.svc==null||!S.day||!S.time){err.textContent=T.errSvc;return}
  if(name.length<2){err.textContent=T.errName;return}
  var s=svcs()[S.svc],d=new Date(S.day+'T12:00:00');
  var r={id:Date.now(),name:name,svc:s[0],price:s[1],day:S.day,dayTxt:fmtDay(d),time:S.time,state:'new'};
  S.reqs.unshift(r);S.visits+=1;S.done=true;var keep=S.day;S.svc=null;S.day=null;S.time=null;
  renderSite();doneStep(0);
  setTimeout(function(){notify(r)},700);
}
function notify(r){
  var n=$('#notif');$('#notifAp').textContent=bizName().charAt(0).toUpperCase();$('#notifName').textContent=bizName();
  $('#notifTxt').textContent=T.notifTxt(r.name,r.svc,r.dayTxt,r.time);

  try{if(navigator.vibrate)navigator.vibrate([60,40,60])}catch(e){}

}

function decide(id,ok){

  var form=function(anchor,title,sub,msg,btn,photo){return '<div class="gs-book" data-anchor="'+anchor+'" style="text-align:left"><h3 style="text-align:center">'+title+'</h3><p style="text-align:center">'+sub+'</p><div style="max-width:440px;margin:0 auto" class="gs-form"><input class="f" placeholder="'+W.qName+'" style="background:var(--card);color:var(--fg);border-color:var(--bd)"><input class="f" placeholder="'+W.qMail+'" style="background:var(--card);color:var(--fg);border-color:var(--bd)"><textarea class="f" placeholder="'+msg+'" style="min-height:80px;background:var(--card);color:var(--fg);border-color:var(--bd)"></textarea>'+(photo?'<div style="padding:12px;border:1px dashed var(--bd);border-radius:10px;text-align:center;color:var(--mu);font-size:12px;margin-bottom:8px">'+W.qPhoto+'</div>':'')+'<button class="gs-btn" data-qsend style="width:100%">'+btn+'</button></div></div>'};
  var contact='<div class="gs-sec" data-anchor="contact" style="padding-top:0"><h2 class="gs-h2">'+W.ctT+'</h2><p class="gs-sub"></p><div class="gs-contact">'+W.ci.map(function(x){return '<div class="gs-ci"><small>'+x[0]+'</small>'+x[1]+'</div>'}).join('')+'<div class="gs-map">📍</div></div></div>';
  var body={
    book:hero+svc+gal+about+revs+book+contact,
    quote:hero+svc+gal+revs+form('q',W.qT,W.qS,W.qMsg,W.qSend,true)+contact,
    shop:hero+shop+about+revs+contact,
    port:hero+gal+svc+about+revs+form('contact',W.cT,W.cS,W.qMsg,W.cSend,false),
    card:hero+svc+contact
  }[ty];
  return '<div class="gs '+WSS.style+' '+cls+'">'+nav+body
   +'<div class="gs-foot">© '+new Date().getFullYear()+' '+n+' · '+W.foot+'</div>'
   +'<div class="gs-wa"><svg viewBox="0 0 24 24"><path d="M12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89S18.6 0 12.05 0z"/></svg></div>'
   +'</div>';
}
function renderWS(){
  var W=WS[lang];
  $$('[data-i]').forEach(function(e){var v=W[e.getAttribute('data-i')];if(typeof v==='string')e.innerHTML=v});
  $('#typeChips').innerHTML=Object.keys(W.types).map(function(k){return '<button data-type="'+k+'" class="'+(WSS.type===k?'on':'')+'">'+W.types[k]+'</button>'}).join('');
  $('#styleChips').innerHTML=Object.keys(W.styles).map(function(k){return '<button data-style="'+k+'" class="'+(WSS.style===k?'on':'')+'">'+W.styles[k]+'</button>'}).join('');
  $$('#devChips button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-dev')===WSS.dev)});
  $('#wsStage').className=WSS.dev==='narrow'?'dev-phone':'';
  var w=$('#wsWide'),nn=$('#wsNarrow'),t1=w.scrollTop,t2=nn.scrollTop;
  w.innerHTML=siteHTML('wide');nn.innerHTML=siteHTML('narrow');w.scrollTop=t1;nn.scrollTop=t2;
  $('#wsUrl').innerHTML='<b>🔒</b>www.'+slug(bizName())+'.be';
  $('#wsCtaTxt').innerHTML=W.wsCta(esc(bizName()));
  var f=$('#finCta');$('#wsCta').href=f?f.href:'index.html#contact';
}
function alertBox(root,msg){if(!root)return;var d=document.createElement('div');d.textContent=msg;d.style.cssText='position:sticky;top:60px;z-index:9;margin:10px auto;max-width:420px;padding:14px 16px;border-radius:14px;background:var(--acc);color:#120c05;font-weight:700;font-size:13px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)';root.insertBefore(d,root.children[1]);setTimeout(function(){d.remove()},3500)}
function setMode(m){WSS.mode=m;$$('#modes button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===m)});
  $('#modeSite').style.display=m==='site'?'':'none';$('#modeBook').style.display=m==='book'?'':'none';
  if(m==='book'){var y=$('#modes').getBoundingClientRect().top+scrollY-10;window.scrollTo({top:y,behavior:'smooth'})}}
document.addEventListener('click',function(e){var b;
  if(b=e.target.closest('[data-mode]')){setMode(b.getAttribute('data-mode'));return}
  if(b=e.target.closest('[data-style]')){WSS.style=b.getAttribute('data-style');renderWS();return}
  if(b=e.target.closest('[data-type]')){WSS.type=b.getAttribute('data-type');WSS.cart=0;renderWS();return}
  if(b=e.target.closest('[data-goto]')){var root=b.closest('.gs'),t=root&&root.querySelector('[data-anchor="'+b.getAttribute('data-goto')+'"]');if(t){var sc=root.closest('.b-view,.scroll');if(sc&&sc.scrollHeight>sc.clientHeight+5&&getComputedStyle(sc).overflowY!=='visible'){sc.scrollTo({top:t.offsetTop-60,behavior:'smooth'})}else{t.scrollIntoView({behavior:'smooth',block:'start'})}}return}
  if(b=e.target.closest('[data-cart]')){WSS.cart=(WSS.cart||0)+1;$$('.gs-cartn').forEach(function(x){x.textContent=WSS.cart});b.textContent=WS[lang].added;return}
  if(b=e.target.closest('[data-checkout]')){alertBox(b.closest('.gs'),WS[lang].checkoutMsg);return}
  if(b=e.target.closest('[data-qsend]')){var fm=b.closest('.gs-form');fm.innerHTML='<p style="text-align:center;color:var(--acc);font-weight:700;padding:20px 0">'+WS[lang].qDone+'</p>';return}
  if(b=e.target.closest('[data-dev]')){WSS.dev=b.getAttribute('data-dev');renderWS();return}
},true);

/* start */
(function(){
  var q=new URLSearchParams(location.search);
  var saved=null;try{saved=localStorage.getItem('di-lang')}catch(e){}
  var nav=(navigator.language||'nl').slice(0,2);lang=q.get('lang')||saved||(nav==='fr'?'fr':(nav==='en'?'en':'nl'));if(!L[lang])lang='nl';
  if(q.get('zaak')){S.name=q.get('zaak').slice(0,40);$('#bizName').value=S.name}
  if(q.get('sector')&&SECTORS[q.get('sector')])S.sector=q.get('sector');
  else if(q.get('type')){S.sector={shop:'shop',port:'photo',quote:'build',card:'other',book:'hair'}[q.get('type')]||S.sector}
  if(q.get('kleur')&&COLORS[+q.get('kleur')])S.color=+q.get('kleur');
  WSS.type=(q.get('type')&&{book:1,quote:1,shop:1,port:1,card:1}[q.get('type')])?q.get('type'):(DEF_TYPE[S.sector]||'book');
  var d=new Date();d.setDate(d.getDate()+3);var key=d.toISOString().slice(0,10);
  S.reqs.push({id:1,name:'Lars V.',svc:svcName(SECTORS[S.sector].svc[1][0]),price:SECTORS[S.sector].svc[1][1],day:key,dayTxt:'',time:'11:30',state:'new'});
  applyColor();T=L[lang];S.reqs[0].dayTxt=fmtDay(d);
  renderStatic();
})();
</script>
